<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - UHS CHOCHAHI CHHAPRA Admissions</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b2f5e; --navy-dark:#071f42; --paper:#f7f5ef; --card:#ffffff;
    --ink:#1c2430; --muted:#5b6472; --line:#d8dce2; --error:#b3261e; --green:#138808;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans Devanagari','Inter',sans-serif;background:var(--paper);color:var(--ink);}
  header{background:linear-gradient(180deg,var(--navy),var(--navy-dark));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{font-size:1.15rem;margin:0;}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px;}
  .signin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input[type=text], .toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
  .toolbar input[type=text]{flex:1;min-width:180px;}
  button{font-family:inherit;font-size:.86rem;font-weight:600;padding:9px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-secondary{background:#fff;color:var(--navy);border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--error);border-color:var(--error);}
  .btn-sm{padding:5px 10px;font-size:.78rem;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  th{background:#f4f6fa;color:var(--navy);position:sticky;top:0;}
  tbody tr:hover{background:#fafbfd;}
  .table-scroll{overflow-x:auto;max-height:65vh;overflow-y:auto;border:1px solid var(--line);border-radius:6px;}
  .count-badge{font-size:.8rem;color:var(--muted);margin-bottom:8px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:8px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 22px;}
  .modal table td{white-space:normal;}
  .modal table td:first-child{color:var(--muted);width:42%;font-weight:600;}
  .modal-close{float:right;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);}
  .photo-row{display:flex;gap:14px;margin-bottom:12px;}
  .photo-row img{border:1px solid var(--line);border-radius:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:10px 18px;border-radius:6px;font-size:.85rem;z-index:60;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <h1>🔐 UHS CHOCHAHI CHHAPRA — Admissions Admin Dashboard</h1>
  <div id="headerRight" class="hidden" style="display:flex;align-items:center;gap:10px;">
    <span id="versionInfo" style="font-size:.78rem;color:#cbd5e1;"></span>
    <button class="btn-secondary btn-sm" id="signOutBtn">Log out</button>
  </div>
</header>

<div class="wrap">
  <div class="signin-screen" id="signinScreen">
    <p>यह डैशबोर्ड केवल अधिकृत स्टाफ के लिए है। कृपया लॉगिन करें।</p>
    <form id="loginForm" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
      <input type="text" id="usernameInput" placeholder="Username" value="admin" autocomplete="username"
        style="padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;min-width:140px;">
      <input type="password" id="passwordInput" placeholder="Admin password" autocomplete="current-password"
        style="padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;min-width:220px;">
      <button type="submit" class="btn-primary" id="loginBtn">लॉगिन / Login</button>
    </form>
    <div id="unauthMsg" class="hidden" style="color:var(--error);font-weight:600;margin-top:10px;"></div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="नाम, Application ID, PEN, आधार, मोबाइल से खोजें...">
        <select id="classFilter">
          <option value="">सभी कक्षाएँ</option>
          <option>Class I</option><option>Class II</option><option>Class III</option>
          <option>Class IV</option><option>Class V</option><option>Class VI</option>
          <option>Class VII</option><option>Class VIII</option><option>Class IX</option>
          <option>Class X</option><option>Class XI</option><option>Class XII</option>
        </select>
        <button class="btn-secondary" id="refreshBtn">🔄 रिफ्रेश</button>
        <button class="btn-secondary" id="exportCsvBtn">⬇ CSV एक्सपोर्ट</button>
      </div>
      <div class="count-badge" id="countBadge"></div>
      <div class="table-scroll">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Application ID</th><th>कक्षा</th><th>संकाय/समूह</th><th>विद्यार्थी का नाम</th>
              <th>मोबाइल</th><th>जमा तिथि</th><th>कार्य</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn-secondary hidden" id="loadMoreBtn">और लोड करें (Load more)</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>

    session = s;

    session = { token: null, username: '', displayName: '' };
    try { sessionStorage.removeItem('uhsAdminSession'); } catch(e){}

    return String(session.username || '').toLowerCase() === 'admin';

  var ADMIN_ALLOWED_IMAGE_TYPES = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];

  function adminProcessImage(file, minKB, maxKB, targetWidth, targetHeight, previewEl, storeCb){

    if(ADMIN_ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1){
      toast('असमर्थित चित्र प्रारूप। केवल JPEG, PNG या WebP स्वीकार्य है।');
      return;
    }
    previewEl.innerHTML = '<p style="color:#666;font-size:.8rem;">Processing...</p>';

    var reader = new FileReader();
    reader.onload = function(event){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

        var quality = 0.90;
        var dataUrl = '';
        var fileSizeKB = 0;
        var attempts = 0;

        do {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          var stringLength = dataUrl.split(',')[1].length;
          fileSizeKB = (stringLength * 3 / 4) / 1024;
          if(fileSizeKB > maxKB){ quality -= 0.05; }
          else if(fileSizeKB < minKB){ quality += 0.03; }
          attempts++;
        } while((fileSizeKB < minKB || fileSizeKB > maxKB) && quality > 0.05 && quality < 1.0 && attempts < 100);

        previewEl.innerHTML = '';
        var resultImg = document.createElement('img');
        resultImg.src = dataUrl;
        resultImg.style.cssText = 'max-width:100%;max-height:90px;object-fit:contain;';
        previewEl.appendChild(resultImg);
        storeCb(dataUrl);
      };
      img.onerror = function(){
        toast('चित्र अमान्य है। कृपया दूसरी फाइल चुनें।');
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // =====================================================================
  // AUTO CROP & STRAIGHTEN — finds the 4 corners of the document in the
  // photo and flattens the perspective. Set a field to false to skip it.
  // =====================================================================
  var AUTO_CROP_FIELDS = { photo:true, signature:true, aadharFront:true, aadharBack:true, tc:true, matric:true };

12.4 6.4 27.4-.8 39.5S486.1 480 472 480L40 480c-14.1 0-27.2-7.4-34.4-19.5s-7.5-27.1-.8-39.5l216-400c7-12.9 20.5-21 35.2-21zm0 352a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.5 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"], "camera": [512, 512, "M149.1 64.8L138.7 96 64 96C28.7 96 0 124.7 0 160L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-74.7 0-10.4-31.2C356.4 45.2 338.1 32 317.4 32L194.6 32c-20.7 0-39 13.2-45.5 32.8zM256 192a96 96 0 1 1 0 192 96 96 0 1 1 0-192z"]};
    function ico(n, sz){ var d = ICONS[n]; return '<svg viewBox="0 0 '+d[0]+' '+d[1]+'" width="'+(sz||16)+'" height="'+(sz||16)+'" fill="currentColor" aria-hidden="true" style="flex:none"><path d="'+d[2]+'"/></svg>'; }
    function boxBlurGray(src, w, h, r) {
      const tmp = new Float32Array(w * h);
      const out = new Float32Array(w * h);
      const n = 2 * r + 1;
      for (let y = 0; y < h; y++) {
        const row = y * w;
        let sum = 0;
        for (let k = -r; k <= r; k++) sum += src[row + Math.min(w - 1, Math.max(0, k))];
        for (let x = 0; x < w; x++) {
          tmp[row + x] = sum / n;
          sum += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
        }
      }
      for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let k = -r; k <= r; k++) sum += tmp[Math.min(h - 1, Math.max(0, k)) * w + x];
        for (let y = 0; y < h; y++) {
          out[y * w + x] = sum / n;
          sum += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
        }
      }
      return out;
    }

    function otsuThreshold(gray) {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < gray.length; i++) hist[Math.max(0, Math.min(255, gray[i] | 0))]++;
      const total = gray.length;
      let sumAll = 0;
      for (let t = 0; t < 256; t++) sumAll += t * hist[t];
      let sumB = 0, wB = 0, best = 0, thr = 128;
      for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        const wF = total - wB;
        if (wF === 0) break;
        sumB += t * hist[t];
        const mB = sumB / wB, mF = (sumAll - sumB) / wF;
        const between = wB * wF * (mB - mF) * (mB - mF);
        if (between > best) { best = between; thr = t; }
      }
      return thr;
    }

    function findMaskComponents(mask, w, h, minArea) {
      const visited = new Uint8Array(w * h);
      const stack = new Int32Array(w * h);
      const comps = [];
      for (let s = 0; s < w * h; s++) {
        if (!mask[s] || visited[s]) continue;
        let sp = 0;
        stack[sp++] = s;
        visited[s] = 1;
        let area = 0;
        let minSum = Infinity, maxSum = -Infinity, minDiff = Infinity, maxDiff = -Infinity;
        let tl = null, br = null, tr = null, bl = null;
        while (sp > 0) {
          const p = stack[--sp];
          const x = p % w, y = (p / w) | 0;
          area++;
          const sum = x + y, diff = x - y;
          if (sum < minSum) { minSum = sum; tl = { x, y }; }
          if (sum > maxSum) { maxSum = sum; br = { x: x + 1, y: y + 1 }; }
          if (diff > maxDiff) { maxDiff = diff; tr = { x: x + 1, y }; }
          if (diff < minDiff) { minDiff = diff; bl = { x, y: y + 1 }; }
          if (x > 0 && mask[p - 1] && !visited[p - 1]) { visited[p - 1] = 1; stack[sp++] = p - 1; }
          if (x < w - 1 && mask[p + 1] && !visited[p + 1]) { visited[p + 1] = 1; stack[sp++] = p + 1; }
          if (y > 0 && mask[p - w] && !visited[p - w]) { visited[p - w] = 1; stack[sp++] = p - w; }

    function polyArea(q) {

    function solveLinear(A, b) {

          for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];

  function formatDateDMY(value){
    if(!value) return '';
    var str = String(value).trim();
    var iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso){
      var rest = str.slice(iso[0].length).trim();
      var timeMatch = rest.match(/(\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM|am|pm)?)/);
      var datePart = iso[3] + '/' + iso[2] + '/' + iso[1];
      return timeMatch ? datePart + ' ' + timeMatch[0] : datePart;
    }
    var dmy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(dmy){
      var dd = ('0' + dmy[1]).slice(-2);
      var mm = ('0' + dmy[2]).slice(-2);
      return dd + '/' + mm + '/' + dmy[3];
    }
    return str;
  }

  function loadApplications(reset){

    var q = document.getElementById('searchBox').value.trim();
    var cls = document.getElementById('classFilter').value;

    callApi({
      action: 'adminList',
      token: session.token,
      search: q,
      class: cls,
      offset: currentOffset,
      limit: CONFIG.PAGE_SIZE

      .then(function(result){

  /**
   * Fetches one private photo/signature file's bytes on demand (via the
   * getImage admin action) and drops it into `container` as an <img>.
   * Shows a small loading placeholder while the request is in flight, and a
   * short note instead of a broken image icon if fileId is blank or the
   * fetch fails (e.g. session expired, file missing).
   */
  function fetchAndShowImage(container, fileId, width, height){
    if(!fileId) return;
    var placeholder = document.createElement('span');
    placeholder.textContent = 'लोड हो रहा है...';
    placeholder.style.cssText = 'display:inline-block;width:'+width+'px;height:'+height+'px;' +
      'font-size:.7rem;color:var(--muted);border:1px dashed var(--border);' +
      'display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;';
    container.appendChild(placeholder);

    callApi({ action: 'getImage', token: session.token, fileId: fileId })
      .then(function(result){
        if(!result.success){
          if(/session|token|unauthorized/i.test(result.error || '')) { showSignIn(result.error); return; }
          placeholder.textContent = 'चित्र लोड नहीं हो सका';
          return;
        }
        var img = document.createElement('img');
        img.src = result.dataUri;
        img.style.cssText = 'width:'+width+'px;height:'+height+'px;object-fit:contain;';
        container.replaceChild(img, placeholder);
      })
      .catch(function(){
        placeholder.textContent = 'नेटवर्क त्रुटि';
      });
  }

  function openEditModal(r){
    var modalContent = document.getElementById('modalContent');
    modalContent.innerHTML = '';

    modalContent.appendChild(note);

    var table = document.createElement('table');
    var inputs = {};

    // Photo / signature / Aadhaar front+back / TC (Class IX) / Matric (Class XI)
    // replacement — shown only for the "admin" account; see handleAdminUpdate_
    // in Code.gs for the actual (server-side) boundary.
    var newImages = {};          // key -> freshly compressed data URL

    if(canExport()){
      var imgSection = document.createElement('div');

      var slots = [

        { key:'aadharFront', label:'नया आधार — आगे का भाग (वैकल्पिक)',   fileId:r.aadharFrontFileId,  w:150, h:105, kind:'doc' },
        { key:'aadharBack',  label:'नया आधार — पीछे का भाग (वैकल्पिक)',  fileId:r.aadharBackFileId,   w:150, h:105, kind:'doc' },
        { key:'tc',          label:'नया TC — कक्षा IX (वैकल्पिक)',        fileId:r.tcFileId,           w:150, h:105, kind:'doc', only:'Class IX' },
        { key:'matric',      label:'नया मैट्रिक प्रमाण पत्र — कक्षा XI (वैकल्पिक)', fileId:r.matricFileId, w:150, h:105, kind:'doc', only:'Class XI' }
      ];

        var box = document.createElement('div');
        var lbl = document.createElement('label');
        lbl.textContent = slot.label;
        lbl.style.cssText = 'display:block;font-size:.85rem;font-weight:600;color:var(--navy);margin-bottom:6px;';
        var preview = document.createElement('div');
        if(slot.fileId){
          fetchAndShowImage(preview, slot.fileId, slot.w, slot.h);

          preview.textContent = 'अभी कोई फाइल नहीं';

        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
        inp.style.cssText = 'margin-top:8px;font-size:.8rem;max-width:100%;';
        inp.addEventListener('change', function(){
          var f = inp.files[0];
          if(!f) return;

            toast('असमर्थित चित्र प्रारूप। केवल JPEG, PNG या WebP स्वीकार्य है।');

          // Same auto-crop & straighten screen as the public form; cancelling keeps the old file.
          cropThen(f, slot.key, function(cropped){
            if(!cropped){ inp.value = ''; return; }
            if(slot.kind === 'fixed'){
              adminProcessImage(cropped, slot.min, slot.max, slot.target.w, slot.target.h, preview, function(u){ newImages[slot.key] = u; });
            } else {
              adminCompressDoc(cropped, preview, function(u){ newImages[slot.key] = u; });

        });
        box.appendChild(lbl); box.appendChild(preview); box.appendChild(inp);
        imgSection.appendChild(box);

      // class value currently typed in this same modal.
      var syncDocSlots = function(){

        .catch(function(){

          saveBtn.textContent = orig;
          toast('नेटवर्क त्रुटि — सहेजा नहीं जा सका।');
        });
    };
    btnRow.appendChild(saveBtn);

    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-secondary';
    cancelBtn.textContent = 'रद्द करें / Cancel';
    cancelBtn.onclick = function(){ document.getElementById('modalOverlay').classList.remove('open'); };
    btnRow.appendChild(cancelBtn);

    modalContent.appendChild(btnRow);
    document.getElementById('modalOverlay').classList.add('open');
  }

  document.getElementById('exportCsvBtn').addEventListener('click', function(){
    var q = document.getElementById('searchBox').value.trim();
    var cls = document.getElementById('classFilter').value;
    var btn = document.getElementById('exportCsvBtn');
    var orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ तैयार हो रहा है...';

    // Always pulls the FULL matching result set from the server (not just the
    // currently loaded page), so the CSV reflects every filtered record.
    callApi({ action: 'adminExport', token: session.token, search: q, class: cls })
      .then(function(result){
        btn.disabled = false; btn.textContent = orig;
        if(!result.success){
          if(/session|token|unauthorized/i.test(result.error || '')) { showSignIn(result.error); return; }
          toast('एक्सपोर्ट विफल: ' + (result.error || ''));
          return;
        }
        var filtered = result.records;
        if(filtered.length === 0){ toast('एक्सपोर्ट के लिए कोई डेटा नहीं है।'); return; }

        var cols = Object.keys(filtered[0]).filter(function(k){ return k !== '_row'; });
        var lines = [cols.join(',')];
        filtered.forEach(function(r){
          lines.push(cols.map(function(c){
            var v = String(r[c] === undefined ? '' : r[c]).replace(/"/g, '""');
            return '"' + v + '"';
          }).join(','));
        });
        var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'uhsk-admissions-' + Date.now() + '.csv';
        a.click();
      })
      .catch(function(){ btn.disabled = false; btn.textContent = orig; toast('नेटवर्क त्रुटि — एक्सपोर्ट नहीं हो सका।'); });
  });

})();
</script>
</body>
</html>
